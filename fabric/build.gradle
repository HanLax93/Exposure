plugins {
    id "com.gradleup.shadow"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

processResources {
    // The dev runtime consumes transformed common classes as a jar. Copy the
    // common assets/data into Fabric's resource root so Fabric exposes them as
    // part of the Exposure mod resource pack as well.
    from(project(":common").sourceSets.main.resources)
}

repositories {
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url = "https://mvn.devos.one/snapshots/" } // Create Fabric, Forge Tags, Milk Lib, Registrate Fabric
    maven { url = "https://mvn.devos.one/releases" } // Porting Lib Releases
    maven { url = "https://maven.cafeteria.dev/releases" } // Fake Player API
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://jitpack.io/" }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    } // Forge Config API Port
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    // Fabric must run against Architectury's transformed common classes so that
    // @ExpectPlatform calls resolve to their Fabric implementations in dev too.
    common(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    dependsOn shadowJar
    from { zipTree(shadowJar.archiveFile.get().asFile) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
