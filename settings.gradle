pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'Exposure'

include 'common'
include 'fabric'
if (providers.gradleProperty('enabled_platforms').getOrElse('').split(',').contains('neoforge')) {
    include 'neoforge'
}
